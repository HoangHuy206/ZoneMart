name: Build iOS IPA

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub
  push:
    branches:
      - main
    paths:
      - 'ZoneMart/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (on macOS Cloud)
    runs-on: macos-15 # macOS 15 Sequoia (Apple Silicon) - macos-14 đã bị GitHub ngừng hỗ trợ từ tháng 11/2026
    defaults:
      run:
        working-directory: ZoneMart

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Cài đặt Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Biên dịch Web Vue 3 (Vite)
        run: npx vite build
        env:
          VITE_API_BASE_URL: https://zonemart.id.vn

      - name: 5. Copy Web Assets sang iOS
        run: npx cap copy ios

      - name: 6. Build Archive & Đóng gói file .IPA
        run: |
          cd ios/App
          # Build Native Xcode Archive (Bỏ qua ký chứng chỉ để người dùng tự ký qua Sideloadly/Esign/AltStore)
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          # Đóng gói App.app thành file IPA chuẩn
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/

          # Đảm bảo biểu tượng ZoneMart hiển thị 100% trong Kho ứng dụng Esign, AltStore, Sideloadly
          ICON_SRC="App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          if [ -f "$ICON_SRC" ]; then
            cp "$ICON_SRC" Payload/App.app/AppIcon60x60@2x.png
            cp "$ICON_SRC" Payload/App.app/AppIcon60x60@3x.png
            cp "$ICON_SRC" Payload/App.app/AppIcon76x76@2x~ipad.png
            cp "$ICON_SRC" Payload/App.app/AppIcon-512@2x.png
            cp "$ICON_SRC" Payload/App.app/icon.png
            cp "$ICON_SRC" iTunesArtwork
            cp "$ICON_SRC" iTunesArtwork@2x
          fi

          zip -r -q ZoneMart.ipa Payload iTunesArtwork iTunesArtwork@2x
          echo "Build file ZoneMart.ipa thành công!"

      - name: 7. Tải lên file IPA để người dùng tải về
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ZoneMart-iOS-IPA
          path: ZoneMart/ios/App/ZoneMart.ipa
          retention-days: 3

      - name: 8. Phát hành GitHub Release (Link tải trực tiếp)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: 'v-ipa-latest'
          name: "ZoneMart iOS IPA (v-ipa-latest)"
          body: |
            🍎 **ZoneMart iOS IPA Đã Đóng Gói Thành Công!**
            - Máy chủ API: `https://zonemart.id.vn`
            - Mã commit: `${{ github.sha }}`
            
            📱 Tải file `ZoneMart.ipa` đính kèm bên dưới để ký & cài qua Sideloadly / ESign / AltStore.
          files: ZoneMart/ios/App/ZoneMart.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
