name: Build iOS IPA & Android APK

on:
  workflow_dispatch: # Cho phép bấm "Run workflow" thủ công trên giao diện GitHub
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA (on macOS Cloud)
    runs-on: macos-14
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Biên dịch Web Vue 3 (Vite)
        run: npx vite build

      - name: 5. Đồng bộ mã sang iOS (Capacitor Sync)
        run: npx cap sync ios

      - name: 6. Build Archive & Đóng gói file .IPA
        run: |
          cd ios/App
          # Build Native Xcode Archive (Bỏ qua ký chứng chỉ để người dùng tự ký qua Sideloadly)
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          # Đóng gói App.app thành file IPA chuẩn
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r -q ZoneMart.ipa Payload
          echo "Build file ZoneMart.ipa thành công!"

      - name: 7. Tải lên file IPA để người dùng tải về
        uses: actions/upload-artifact@v4
        with:
          name: ZoneMart-iOS-IPA
          path: ios/App/ZoneMart.ipa
          retention-days: 14

